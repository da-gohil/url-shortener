services:
  postgres:
    image: postgres:17
    container_name: url-shortener-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: urlshortener-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: