spring.application.name=url-shortener

#To see HTML updates immediately on browser refresh without restarting the app
spring.thymeleaf.cache=false
#Data Source properties for Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener-db
spring.datasource.username=postgres
spring.datasource.password=abc123

#we have multiple options: update / create / validate based on different use cases
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Docker lifecycle management
spring.docker.compose.lifecycle-management=start_and_stop
#Enabled by default
spring.jpa.open-in-view=true

#Base URL used when rendering short links
app.base-url=http://localhost:8080
app.default-expiry-in-days=30
app.validate-original-url=true
#Rows per page on the home, My URLs and admin listings
app.page-size=10

#Hosts (and their subdomains) that can never be shortened, comma separated
app.url-safety.blocked-hosts=
#Google Safe Browsing v4 API key; leave blank to skip the lookup. Keep real keys out
#of git: set APP_URL_SAFETY_SAFE_BROWSING_API_KEY in the environment instead.
app.url-safety.safe-browsing-api-key=

#Rate limits (in memory, per instance). Client IPs come from the connection; behind a
#reverse proxy set server.forward-headers-strategy=native so the real IP is used.
app.rate-limit.anonymous-links-per-hour=10
app.rate-limit.user-links-per-hour=100
app.rate-limit.login-failures-per-account=5
app.rate-limit.login-failures-per-ip=20
app.rate-limit.login-lockout-minutes=15
app.rate-limit.registrations-per-ip-per-hour=5
