<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>

<head>
    <title>Admin · Users</title>
</head>

<body>
<div layout:fragment="content">
    <h1 class="mt-4 h3">Admin Dashboard</h1>
    <ul th:replace="~{fragments/admin-nav :: adminNav(${adminTab})}"></ul>

    <form th:action="@{/admin/users}" method="get" class="row g-2 mb-3" role="search">
        <div class="col-12 col-md-5">
            <label for="q" class="visually-hidden">Search users</label>
            <input type="search" class="form-control" id="q" name="q" th:value="${query}"
                   placeholder="Name or email">
        </div>
        <div class="col-auto d-flex gap-2">
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:if="${query}" th:href="@{/admin/users}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <p class="text-muted small" th:text="${users.totalElements} + ' users'"></p>

    <div th:if="${users.data.isEmpty()}" class="alert alert-info">No users match.</div>

    <div th:unless="${users.data.isEmpty()}" class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th class="text-end">Links</th>
                <th>Joined</th>
                <th><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users.data}" th:with="self=${u.id == currentUserId}">
                <td>
                    <span th:text="${u.name}"></span>
                    <span th:if="${self}" class="badge bg-info text-dark ms-1">You</span>
                </td>
                <td th:text="${u.email}"></td>
                <td>
                    <span th:if="${u.isAdmin()}" class="badge bg-primary">Admin</span>
                    <span th:unless="${u.isAdmin()}" class="badge bg-light text-dark border">User</span>
                </td>
                <td>
                    <span th:if="${u.enabled}" class="badge bg-success">Active</span>
                    <span th:unless="${u.enabled}" class="badge bg-danger">Disabled</span>
                </td>
                <td class="text-end">
                    <a th:href="@{/admin/links(owner=${u.id})}" th:text="${u.linkCount}"
                       th:aria-label="'Links by ' + ${u.name}"></a>
                </td>
                <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}"></td>
                <td class="text-end text-nowrap">
                    <!-- no self-service: an admin can't demote or disable themselves -->
                    <th:block th:unless="${self}">
                        <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-inline">
                            <input type="hidden" name="returnTo" th:value="${returnTo}">
                            <input type="hidden" name="role" th:value="${u.isAdmin()} ? 'ROLE_USER' : 'ROLE_ADMIN'">
                            <button type="submit" class="btn btn-sm btn-outline-primary py-0"
                                    th:attr="data-confirm=${u.isAdmin()} ? ${'Remove admin rights from ' + u.name + '?'} : ${'Make ' + u.name + ' an admin?'}"
                                    th:text="${u.isAdmin()} ? 'Remove admin' : 'Make admin'">Make admin</button>
                        </form>
                        <form th:action="${u.enabled} ? @{/admin/users/{id}/disable(id=${u.id})} : @{/admin/users/{id}/enable(id=${u.id})}"
                              method="post" class="d-inline">
                            <input type="hidden" name="returnTo" th:value="${returnTo}">
                            <button type="submit" class="btn btn-sm py-0"
                                    th:classappend="${u.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                                    th:attr="data-confirm=${u.enabled} ? ${'Disable ' + u.name + '? They will be signed out and unable to sign in.'} : null"
                                    th:text="${u.enabled} ? 'Disable' : 'Enable'">Disable</button>
                        </form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/pagination :: pager(${users}, ${paginationUrl})}"></div>
</div>
</body>
</html>
