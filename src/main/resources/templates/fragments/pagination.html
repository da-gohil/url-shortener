<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- page numbers are 1-based, matching PagedResult.pageNumber and the ?page= param -->
<nav th:fragment="pager(page, url)" th:if="${page.totalPages > 1}" aria-label="Page navigation">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.isFirst} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.pageNumber - 1})}"
               tabindex="-1" aria-label="Previous">&laquo;</a>
        </li>
        <!-- pageLinks() is windowed; a null entry is a gap between page numbers -->
        <th:block th:each="i : ${page.pageLinks()}">
            <li th:if="${i == null}" class="page-item disabled">
                <span class="page-link">&hellip;</span>
            </li>
            <li th:unless="${i == null}" class="page-item"
                th:classappend="${i == page.pageNumber} ? 'active'">
                <a class="page-link" th:href="@{${url}(page=${i})}" th:text="${i}"
                   th:attr="aria-current=${i == page.pageNumber} ? 'page' : null"></a>
            </li>
        </th:block>
        <li class="page-item" th:classappend="${page.isLast} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.pageNumber + 1})}"
               aria-label="Next">&raquo;</a>
        </li>
    </ul>
</nav>

</body>
</html>
