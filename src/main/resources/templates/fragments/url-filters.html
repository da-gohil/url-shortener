<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Search / filter / sort bar for a short-URL listing, bound to a ShortUrlFilter.
  `action` is the listing's path. A page may put a `hiddenFilterParams` map in the
  model for extra criteria to carry along (the admin Links tab's owner filter).
-->
<div th:fragment="filterForm(action, filter)">
    <!-- GET, so the filters live in the URL: shareable, bookmarkable, kept across pages -->
    <form th:action="@{${action}}" method="get" class="row g-2 align-items-end mb-3" role="search">
        <!-- extra criteria a page wants kept when the form is resubmitted, e.g. owner -->
        <input th:each="extra : ${hiddenFilterParams}" type="hidden"
               th:name="${extra.key}" th:value="${extra.value}">
        <div class="col-12 col-md-4">
            <label for="q" class="form-label small text-muted mb-1">Search</label>
            <input type="search" class="form-control" id="q" name="q"
                   th:value="${filter.query}" placeholder="Short key or destination URL">
        </div>
        <div class="col-6 col-md-2">
            <label for="visibility" class="form-label small text-muted mb-1">Visibility</label>
            <select class="form-select" id="visibility" name="visibility">
                <option value="all">All</option>
                <option value="public" th:selected="${filter.visibility.name() == 'PUBLIC'}">Public</option>
                <option value="private" th:selected="${filter.visibility.name() == 'PRIVATE'}">Private</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label for="status" class="form-label small text-muted mb-1">Status</label>
            <select class="form-select" id="status" name="status">
                <option value="all">All</option>
                <option value="active" th:selected="${filter.status.name() == 'ACTIVE'}">Active</option>
                <option value="expired" th:selected="${filter.status.name() == 'EXPIRED'}">Expired</option>
                <option value="disabled" th:selected="${filter.status.name() == 'DISABLED'}">Disabled</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label for="sort" class="form-label small text-muted mb-1">Sort by</label>
            <select class="form-select" id="sort" name="sort">
                <option value="newest">Newest</option>
                <option value="oldest" th:selected="${filter.sort.name() == 'OLDEST'}">Oldest</option>
                <option value="clicks" th:selected="${filter.sort.name() == 'CLICKS'}">Most clicks</option>
                <option value="expiry" th:selected="${filter.sort.name() == 'EXPIRY'}">Expiring soonest</option>
            </select>
        </div>
        <div class="col-6 col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">Apply</button>
            <a th:if="${filter.isCustomised()}" th:href="@{${action}}"
               class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>
</div>

</body>
</html>
