<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Shared short-URL table. When `deletable` is true the rows gain a checkbox column
  and the whole table is wrapped in a form posting to `deleteUrl`.
-->
<div th:fragment="urlTable(page, baseUrl, deletable, deleteUrl, showOwner)" id="url-table">
    <!-- a page may set `emptyMessage`, e.g. when filters hide everything -->
    <div th:if="${page.data.isEmpty()}" class="alert alert-info"
         th:text="${emptyMessage} ?: 'No URLs to show yet.'">
        No URLs to show yet.
    </div>

    <form th:unless="${page.data.isEmpty()}" th:action="@{${deleteUrl}}" method="post">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                <tr>
                    <th th:if="${deletable}" style="width:1%"></th>
                    <th>Short URL</th>
                    <th>Original URL</th>
                    <th th:if="${showOwner}">Created By</th>
                    <th class="text-end">Clicks</th>
                    <th>Visibility</th>
                    <th>Created</th>
                    <th>Expires</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="url : ${page.data}">
                    <td th:if="${deletable}">
                        <input type="checkbox" class="form-check-input" name="ids"
                               th:value="${url.id}" th:aria-label="'Select ' + ${url.shortKey}">
                    </td>
                    <td>
                        <a th:href="@{/s/{key}(key=${url.shortKey})}"
                           th:text="${baseUrl + '/s/' + url.shortKey}" target="_blank"></a>
                    </td>
                    <td>
                        <a th:href="${url.originalUrl}"
                           th:text="${#strings.abbreviate(url.originalUrl, 50)}" target="_blank"></a>
                    </td>
                    <td th:if="${showOwner}"
                        th:text="${url.createdBy != null ? url.createdBy.name : 'Guest'}"></td>
                    <td class="text-end" th:text="${url.clickCount != null ? url.clickCount : 0}"></td>
                    <td>
                        <span th:if="${url.isPrivate}" class="badge bg-secondary">Private</span>
                        <span th:unless="${url.isPrivate}" class="badge bg-success">Public</span>
                    </td>
                    <td th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm') : 'Never'}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <button th:if="${deletable}" type="submit" class="btn btn-danger btn-sm"
                onclick="return confirm('Delete the selected URLs?')">
            Delete Selected
        </button>
    </form>
</div>

</body>
</html>
