<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="A simple URL shortener service. Create short and easy-to-share links.">
    <!-- decorated templates override this by declaring their own <title> -->
    <title>URL Shortener</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/styles.css}"/>
    <th:block layout:fragment="pageCss"></th:block>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">URL Shortener</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:classappend="${activeNav == 'home'} ? 'active'"
                       th:attrappend="aria-current=${activeNav == 'home'} ? 'page'">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}"
                       th:classappend="${activeNav == 'about'} ? 'active'"
                       th:attrappend="aria-current=${activeNav == 'about'} ? 'page'">About</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/my-urls}"
                       th:classappend="${activeNav == 'my-urls'} ? 'active'"
                       th:attrappend="aria-current=${activeNav == 'my-urls'} ? 'page'">My URLs</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}"
                       th:classappend="${activeNav == 'admin'} ? 'active'"
                       th:attrappend="aria-current=${activeNav == 'admin'} ? 'page'">Admin Dashboard</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-md-center">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}"
                       th:classappend="${activeNav == 'login'} ? 'active'">Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/register}"
                       th:classappend="${activeNav == 'register'} ? 'active'">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="navbar-text me-2">Signed in as
                        <span sec:authentication="principal.name">user</span></span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <!-- POST, so Thymeleaf attaches the CSRF token Spring Security requires -->
                    <form th:action="@{/logout}" method="post" class="d-flex">
                        <button type="submit" class="btn btn-link nav-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">

    <div th:replace="~{fragments/alerts :: alert('success', ${successMessage})}"></div>
    <div th:replace="~{fragments/alerts :: alert('danger', ${errorMessage})}"></div>

    <div layout:fragment="content">
        <!-- Your Page Content Here -->
    </div>

</div>

<footer class="mt-auto py-3 bg-light">
    <div class="container text-center text-muted">
        <small>URL Shortener &middot; built by Darshan Gohil</small>
    </div>
</footer>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<th:block layout:fragment="pageScripts"></th:block>

</body>
</html>
