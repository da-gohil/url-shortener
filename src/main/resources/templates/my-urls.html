<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>

<head>
    <title>My URLs</title>
</head>

<body>
<div layout:fragment="content">
    <h1 class="mt-4 mb-3">My URLs</h1>

    <div class="row g-3 mb-4" th:object="${stats}">
        <div class="col-6 col-md-3">
            <div class="card text-center h-100"><div class="card-body">
                <div class="fs-3 fw-semibold" th:text="*{totalLinks}">0</div>
                <div class="text-muted small">Links</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center h-100"><div class="card-body">
                <div class="fs-3 fw-semibold" th:text="*{totalClicks}">0</div>
                <div class="text-muted small">Total clicks</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center h-100"><div class="card-body">
                <div class="fs-3 fw-semibold text-success" th:text="*{activeLinks}">0</div>
                <div class="text-muted small">Active</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center h-100"><div class="card-body">
                <div class="fs-3 fw-semibold text-secondary" th:text="*{expiredLinks()}">0</div>
                <div class="text-muted small">Expired</div>
            </div></div>
        </div>
    </div>

    <div th:replace="~{fragments/url-filters :: filterForm('/my-urls', ${filter})}"></div>

    <p th:if="${stats.disabledLinks > 0}" class="text-danger small"
       th:text="${stats.disabledLinks} + ' of your links ' + (${stats.disabledLinks} == 1 ? 'was' : 'were') + ' disabled by an admin and no longer redirect.'"></p>

    <p th:if="${filter.isFiltering()}" class="text-muted small"
       th:text="${shortUrls.totalElements} + ' of ' + ${stats.totalLinks} + ' links match'"></p>

    <div th:replace="~{fragments/url-table :: urlTable(${shortUrls}, ${baseUrl}, true, '/delete-urls', false, true)}"></div>
    <div th:replace="~{fragments/pagination :: pager(${shortUrls}, ${paginationUrl})}"></div>
</div>
</body>
</html>
