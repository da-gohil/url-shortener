<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>

<head>
    <title>My URLs</title>
</head>

<body>
<div layout:fragment="content">
    <h1 class="mt-4 mb-3">My URLs</h1>

    <div class="row g-3 mb-4" th:object="${stats}">
        <div class="col-6 col-md-3">
            <div class="card text-center h-100"><div class="card-body">
                <div class="fs-3 fw-semibold" th:text="*{totalLinks}">0</div>
                <div class="text-muted small">Links</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center h-100"><div class="card-body">
                <div class="fs-3 fw-semibold" th:text="*{totalClicks}">0</div>
                <div class="text-muted small">Total clicks</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center h-100"><div class="card-body">
                <div class="fs-3 fw-semibold text-success" th:text="*{activeLinks}">0</div>
                <div class="text-muted small">Active</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center h-100"><div class="card-body">
                <div class="fs-3 fw-semibold text-secondary" th:text="*{expiredLinks()}">0</div>
                <div class="text-muted small">Expired</div>
            </div></div>
        </div>
    </div>

    <!-- GET, so the filters live in the URL: shareable, bookmarkable, kept across pages -->
    <form th:action="@{/my-urls}" method="get" class="row g-2 align-items-end mb-3" role="search">
        <div class="col-12 col-md-4">
            <label for="q" class="form-label small text-muted mb-1">Search</label>
            <input type="search" class="form-control" id="q" name="q"
                   th:value="${filter.query}" placeholder="Short key or destination URL">
        </div>
        <div class="col-6 col-md-2">
            <label for="visibility" class="form-label small text-muted mb-1">Visibility</label>
            <select class="form-select" id="visibility" name="visibility">
                <option value="all">All</option>
                <option value="public" th:selected="${filter.visibility.name() == 'PUBLIC'}">Public</option>
                <option value="private" th:selected="${filter.visibility.name() == 'PRIVATE'}">Private</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label for="status" class="form-label small text-muted mb-1">Status</label>
            <select class="form-select" id="status" name="status">
                <option value="all">All</option>
                <option value="active" th:selected="${filter.status.name() == 'ACTIVE'}">Active</option>
                <option value="expired" th:selected="${filter.status.name() == 'EXPIRED'}">Expired</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label for="sort" class="form-label small text-muted mb-1">Sort by</label>
            <select class="form-select" id="sort" name="sort">
                <option value="newest">Newest</option>
                <option value="oldest" th:selected="${filter.sort.name() == 'OLDEST'}">Oldest</option>
                <option value="clicks" th:selected="${filter.sort.name() == 'CLICKS'}">Most clicks</option>
                <option value="expiry" th:selected="${filter.sort.name() == 'EXPIRY'}">Expiring soonest</option>
            </select>
        </div>
        <div class="col-6 col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">Apply</button>
            <a th:if="${filter.isCustomised()}" th:href="@{/my-urls}"
               class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <p th:if="${filter.isFiltering()}" class="text-muted small"
       th:text="${shortUrls.totalElements} + ' of ' + ${stats.totalLinks} + ' links match'"></p>

    <div th:replace="~{fragments/url-table :: urlTable(${shortUrls}, ${baseUrl}, true, '/delete-urls', false)}"></div>
    <div th:replace="~{fragments/pagination :: pager(${shortUrls}, ${paginationUrl})}"></div>
</div>
</body>
</html>
